    <title>Gallery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f5f5f5;
      }
      h1 {
        text-align: center;
        color: #333;
        font-weight: 400;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
        margin-bottom: 20px;
      }
      .photo {
        border: 2px solid #f7a1e3;
        border-radius: 8px;
        overflow: hidden;
        background: #f7a1e3;
      }
      .menu-bar {
        width: 100%;
        background: #f7a1e3;
        position: sticky;
        top: 0;
        z-index: 1000;
        margin-bottom: 30px;
        box-shadow: 0 2px 6px #f7a1e3;
      }
      .menu-bar ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        background: #f7a1e3;
      }
      .menu-bar li {
        margin: 0 20px;
        background: #f7a1e3;
      }
      .menu-bar a {
        display: block;
        color: black;
        text-decoration: none;
        padding: 16px 0;
        font-size: 1.1em;
        transition: color 0.2s;
      }
      .menu-bar a:hover {
        color: #ff9800;
      }
      .photo img {
        width: 150%;
        height: 200px;
        object-fit: cover;
      }
      .photo-title {
        padding: 10px;
        text-align: center;
        font-weight: bold;
        color: #555;
      }
      .hidden-photos {
        display: none;
      }
      .hidden-photos.show {
        display: block;
      }
      .expand-btn {
        display: block;
        margin: 0 auto 20px auto;
      }
      h2 {
        text-align: center;
        color: #444;
        font-weight: 400;
        margin-bottom: 10px;
      }
      /* Lightbox styles */
      .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .lightbox img {
        max-width: 90%;
        max-height: 80%;
        border: 5px solid white;
        border-radius: 10px;
      }
      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 2em;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

    <div class="lightbox" id="lightbox">
      <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
      <img id="lightboxImage" src="" alt="Expanded view" />
    </div>

    <script>
      let expanded = false;
      function toggleGallery() {
        const hiddenPhotos = document.getElementById("hiddenPhotos");
        const expandBtn = document.getElementById("expandBtn");
        if (!expanded) {
          hiddenPhotos.classList.add("show");
          expandBtn.textContent = "Show Less";
          expanded = true;
        } else {
          hiddenPhotos.classList.remove("show");
          expandBtn.textContent = "View More Photos";
          expanded = false;
        }
      }

      let expanded2 = false;
      function toggleGallery2() {
        const hiddenPhotos2 = document.getElementById("hiddenPhotos2");
        const expandBtn2 = document.getElementById("expandBtn2");
        if (!expanded2) {
          hiddenPhotos2.classList.add("show");
          expandBtn2.textContent = "Show Less";
          expanded2 = true;
        } else {
          hiddenPhotos2.classList.remove("show");
          expandBtn2.textContent = "View More Photos";
          expanded2 = false;
        }
      }

      // Open lightbox
      const lightbox = document.getElementById("lightbox");
      const lightboxImage = document.getElementById("lightboxImage");

      document.querySelectorAll(".gallery .photo a").forEach((anchor) => {
        anchor.addEventListener("click", (event) => {
          event.preventDefault();
          const imgSrc = anchor.getAttribute("href");
          lightboxImage.src = imgSrc;
          lightbox.style.display = "flex";
        });
      });

      // Close lightbox
      function closeLightbox() {
        lightbox.style.display = "none";
        lightboxImage.src = "";
      }

      // Close lightbox when clicking outside the image
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
    </script>
