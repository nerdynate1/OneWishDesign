        <div class="lightbox" id="lightbox">
          <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
          <img id="lightboxImage" src="" alt="Expanded view" />
        </div>

        <script>
          let expanded = false;
          function toggleGallery() {
            const hiddenPhotos = document.getElementById("hiddenPhotos");
            const expandBtn = document.getElementById("expandBtn");
            if (!expanded) {
              hiddenPhotos.classList.add("show");
              expandBtn.textContent = "Show Less";
              expanded = true;
            } else {
              hiddenPhotos.classList.remove("show");
              expandBtn.textContent = "View More Photos";
              expanded = false;
            }
          }

          let expanded2 = false;
          function toggleGallery2() {
            const hiddenPhotos2 = document.getElementById("hiddenPhotos2");
            const expandBtn2 = document.getElementById("expandBtn2");
            if (!expanded2) {
              hiddenPhotos2.classList.add("show");
              expandBtn2.textContent = "Show Less";
              expanded2 = true;
            } else {
              hiddenPhotos2.classList.remove("show");
              expandBtn2.textContent = "View More Photos";
              expanded2 = false;
            }
          }

          // Open lightbox
          const lightbox = document.getElementById("lightbox");
          const lightboxImage = document.getElementById("lightboxImage");

          document.querySelectorAll(".gallery .photo a").forEach((anchor) => {
            anchor.addEventListener("click", (event) => {
              event.preventDefault();
              const imgSrc = anchor.getAttribute("href");
              lightboxImage.src = imgSrc;
              lightbox.style.display = "flex";
            });
          });

          // Close lightbox
          function closeLightbox() {
            lightbox.style.display = "none";
            lightboxImage.src = "";
          }

          // Close lightbox when clicking outside the image
          lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
              closeLightbox();
            }
          });
        </script>
